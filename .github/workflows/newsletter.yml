name: EM Weekly Digest

# Trigger: ESCLUSIVAMENTE esterno via workflow_dispatch.
# Lo scheduling è gestito da cron-job.org, che chiama l'endpoint GitHub:
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/newsletter.yml/dispatches
#   body: {"ref": "main"}
# cron-job.org va configurato su LUNEDÌ 13:00 ora di Roma (gestisce il fuso/DST,
# a differenza dei cron schedulati di GitHub Actions che sono solo in UTC).
# Nessuno 'schedule' qui: cosi' il workflow non viene mai disattivato per
# inattivita' e parte solo quando lo chiama cron-job.org (o un avvio manuale).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prova a vuoto: esegue tutto ma NON invia l'email"
        type: boolean
        default: false
      solo_facebook:
        description: "Solo Facebook: pubblica i post ma NON invia l'email"
        type: boolean
        default: false
      podcast:
        description: "Genera il podcast e lo pubblica col post del lunedì"
        type: boolean
        default: true

# Evita doppi invii se cron-job.org spara due trigger ravvicinati:
# il secondo run attende (non cancella) ma non gira in parallelo.
concurrency:
  group: newsletter-invio
  cancel-in-progress: false

jobs:
  invia-newsletter:
    runs-on: ubuntu-latest
    # Dipendenze del podcast fino a 15 minuti, newsletter pochi minuti, podcast fino a
    # 45 (voce generata su CPU, poi si rinuncia), pubblicazione e artifact: 90 di margine.
    timeout-minutes: 90
    env:
      # Vuoto quando il workflow parte da cron-job.org: valgono i default.
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      SOLO_FACEBOOK: ${{ inputs.solo_facebook && '1' || '' }}
      # Da cron-job.org gli input sono vuoti: il podcast resta attivo (default di config.py).
      PODCAST: ${{ inputs.podcast == false && '0' || '1' }}
      # Motore della voce: 'gemini' (predefinito, API di Google) o 'chatterbox' (modello
      # locale). Si cambia con la variabile di repository PODCAST_MOTORE, senza toccare il codice.
      PODCAST_MOTORE: ${{ vars.PODCAST_MOTORE || 'gemini' }}
      # Ripiego automatico su Chatterbox se Gemini fallisce: '0' nella variabile lo spegne.
      PODCAST_RIPIEGO: ${{ vars.PODCAST_RIPIEGO || '1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Versioni pinnate: un breaking change delle librerie Google non deve
      # poter bloccare l'invio del lunedì. Aggiornare qui in modo controllato.
      - name: Installa dipendenze
        run: |
          pip install \
            google-auth-oauthlib==1.4.0 \
            google-auth-httplib2==0.4.0 \
            google-api-python-client==2.198.0
          pip install playwright==1.49.0
          playwright install --with-deps chromium

      # ── PODCAST: dipendenze ────────────────────────────────────────────────
      # Il podcast si genera DENTRO "Esegui newsletter", prima della mail, perché
      # l'MP3 parte allegato. Le dipendenze si installano quindi prima. Passo non
      # bloccante: se fallisce, la newsletter esce senza podcast come prima.
      # Modelli (voce ~3 GB, Whisper) e pacchetti restano in cache fra un lunedì
      # e l'altro: la prima corsa è più lenta.
      - name: Cache modelli e pacchetti del podcast
        if: env.PODCAST == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: podcast-modelli-v2

      - name: Installa dipendenze podcast
        id: dipendenze_podcast
        if: env.PODCAST == '1'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          # Bastano a Gemini TTS: Whisper (verifica), numeri in lettere, audio.
          pip install faster-whisper==1.2.1 num2words==0.5.14 soundfile librosa==0.11.0

      # Voce locale Chatterbox: motore scelto (PODCAST_MOTORE = chatterbox) o ripiego
      # quando Gemini non risponde (spento con PODCAST_RIPIEGO = 0). Passo separato:
      # se fallisce si perde solo il ripiego, non il podcast con Gemini.
      - name: Installa Chatterbox (ripiego della voce)
        if: env.PODCAST == '1' && (env.PODCAST_MOTORE == 'chatterbox' || env.PODCAST_RIPIEGO != '0')
        continue-on-error: true
        timeout-minutes: 15
        run: |
          # PyTorch solo CPU (i runner non hanno GPU): evita ~2 GB di librerie CUDA.
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts==0.1.7 pyloudnorm==0.2.0 "setuptools<81"

      # Avvisi dei corsi (corsi.json): controllo non bloccante, un errore compare come
      # avviso giallo nel riepilogo del run e la newsletter parte senza avvisi.
      - name: Controlla corsi.json
        continue-on-error: true
        run: python corsi.py && python -m unittest discover -s tests

      # Newsletter completa: selezione, sintesi, schede, podcast (fino a 45 minuti,
      # poi si rinuncia), mail con l'MP3 allegato, post Facebook. Parte all'ora in
      # cui cron-job.org avvia il workflow; la mail esce a podcast pronto.
      # Segna l'ora d'inizio (UTC): l'avviso per email legge dal log solo le righe di
      # questo run, non quelle dei test che scrivono nello stesso file.
      - name: Segna l'inizio della newsletter
        run: echo "NEWSLETTER_INIZIO=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: Esegui newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          DESTINATARI: ${{ secrets.DESTINATARI }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # Instagram (carosello): senza questo secret non si pubblica
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 'success', 'failure' o vuoto (passo saltato): se non è 'success' il podcast non si tenta
          PODCAST_DIPENDENZE: ${{ steps.dipendenze_podcast.outcome || 'skipped' }}
          # niente barre di avanzamento nel log (sarebbero migliaia di righe)
          TQDM_DISABLE: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: python newsletter_rss.py

      # Gira sempre: pubblica il post del lunedì rimandato dalla newsletter,
      # col video se c'è, altrimenti con l'immagine. Se la newsletter è fallita
      # prima dei post, non trova nulla da pubblicare ed esce.
      - name: Pubblica il post del lunedì (video del podcast o immagine)
        if: always() && env.PODCAST == '1'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python podcast.py pubblica

      # Caricato anche quando un passo precedente fallisce: il log e' proprio
      # cio' che serve quando qualcosa e' andato storto.
      - name: Carica anteprima, log e podcast
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: |
            anteprima_digest.html
            newsletter.log
            immagini/
            instagram/
            post_facebook.txt
            post_facebook_podcast.txt
            post_gruppo.txt
            archivio/
            podcast/
          if-no-files-found: warn
          retention-days: 14

      # Email a AVVISI_EMAIL solo se un invio e' fallito o e' uscito incompleto (errori nel log
      # del run). Se va tutto bene non scrive. Mai bloccante. Non parte nelle prove.
      - name: Avvisa per email se qualcosa e' andato storto
        if: always() && !inputs.dry_run && !inputs.solo_facebook
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          AVVISI_EMAIL: ${{ secrets.AVVISI_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
        run: python avviso.py
